[project]
name = "apnaneta"
version = "0.1.0"
description = "Automated Political Accountability Infrastructure: Autonomous Ingestion, Algorithmic Verification, and Multi-Dimensional Governance Tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pymupdf>=1.24.0",
    "google-genai>=0.1.0",
    "httpx>=0.27.0",
    "curl_cffi>=0.7.0",
    "splink>=4.0.0",
    "diskcache>=5.6.0",
    "tqdm>=4.66.0",
    "boto3>=1.34.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
