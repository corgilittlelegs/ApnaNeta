name: Test Form 26 AI Extraction with Gemini Flash

on:
  workflow_dispatch:

jobs:
  test_gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install AI & Ingestion Dependencies
        run: |
          pip install google-genai httpx pydantic pydantic-settings

      - name: Execute Gemini Flash Extraction & Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: .
        run: |
          python -m src.parsing.test_extraction
