name: Test Form 26 AI Extraction with Gemini Flash

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install AI & Ingestion Dependencies
        run: |
          pip install google-genai httpx pydantic pydantic-settings

      - name: Execute Gemini Flash Extraction & Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: .
        run: |
          python -m src.parsing.test_extraction
