name: Sync Politician Photos (Wikidata & Wikimedia)

on:
  schedule:
    - cron: '0 6 1 * *' # Runs monthly on the 1st at 06:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max number of parliamentarian photos to sync ('all' to automatically query all MPs, or a specific limit like 100)"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  sync_photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install httpx pydantic pydantic-settings

      - name: Run Wikidata & Wikimedia Photo Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMIT: ${{ inputs.limit || 'all' }}
          PYTHONPATH: .
        run: |
          python -m src.ingestion.wikidata_photos
