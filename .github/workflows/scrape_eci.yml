name: Ingest ECI Candidate Affidavits

on:
  schedule:
    - cron: '0 12 * * 0' # Weekly trigger on Sundays at 12:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      state:
        description: "Target State (e.g. 'National', 'Maharashtra', 'Delhi')"
        required: false
        default: "National"

jobs:
  scrape_eci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ingestion Dependencies
        run: |
          pip install httpx curl_cffi pydantic pydantic-settings boto3

      - name: Run ECI Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'apnaneta-affidavits' }}
        run: |
          python -c "
          print('ECI Ingestion Runner initialized for: ${{ github.event.inputs.state || 'National' }}')
          # Worker checks for active election calendars and processes affidavits
          "
