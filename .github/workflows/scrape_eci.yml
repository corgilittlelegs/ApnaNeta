name: Ingest ECI Candidate Affidavits

on:
  schedule:
    - cron: '0 12 * * 0' # Weekly automatic run on Sundays at 12:00 UTC
  workflow_dispatch: # Zero-configuration 1-click trigger from GitHub UI
    inputs:
      state:
        description: "Target State ('ALL' for all 28 states & UTs, or e.g. 'Maharashtra')"
        required: false
        default: "ALL"
      batch_limit:
        description: "Batch limit per state (0 for all constituencies, or e.g. 5 for a quick test)"
        required: false
        default: "0"

jobs:
  scrape_eci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ingestion Dependencies
        run: |
          pip install httpx curl_cffi pydantic pydantic-settings boto3 beautifulsoup4

      - name: Run ECI Scraper (Automated Multi-State Vidhan Sabha)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          TARGET_STATE: ${{ inputs.state || 'ALL' }}
          BATCH_LIMIT: ${{ inputs.batch_limit || '0' }}
          CONSTITUENCY_NO: "all"
          HOUSE: "Vidhan Sabha"
          PYTHONPATH: .
        run: |
          python -m src.ingestion.eci_affidavits
