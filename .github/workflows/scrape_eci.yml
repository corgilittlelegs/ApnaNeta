name: Ingest ECI Candidate Affidavits

on:
  schedule:
    # Daily regional automated rotation (04:00 UTC = 09:30 AM IST)
    - cron: '0 4 * * 1' # Monday: North Region (Delhi, UP, Punjab, Haryana, HP, J&K, UK)
    - cron: '0 4 * * 2' # Tuesday: West Region (Maharashtra, Gujarat, Rajasthan, Goa)
    - cron: '0 4 * * 3' # Wednesday: South Region (Karnataka, TN, Kerala, AP, Telangana, Puducherry)
    - cron: '0 4 * * 4' # Thursday: East & Central Region (WB, Bihar, Odisha, Jharkhand, MP, CG)
    - cron: '0 4 * * 5' # Friday: Northeast Region (Assam, Arunachal, Manipur, Meghalaya, etc.)
  workflow_dispatch: # 1-click zero-configuration trigger from GitHub Actions UI
    inputs:
      region:
        description: "Geographic Region Rotation"
        type: choice
        required: false
        default: "AUTO_BY_DAY"
        options:
          - "AUTO_BY_DAY"
          - "WEST"
          - "NORTH"
          - "SOUTH"
          - "EAST_CENTRAL"
          - "NORTHEAST"
          - "ALL"
      state:
        description: "Target State override (leave 'ALL' to process entire region)"
        required: false
        default: "ALL"
      batch_limit:
        description: "Batch limit per state (0 for all constituencies, or e.g. 5 for testing)"
        required: false
        default: "0"
      max_candidates:
        description: "Top candidates per constituency (default 2 prioritizes sitting MLAs & rivals; 0 for all)"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  scrape_eci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ingestion Dependencies
        run: |
          pip install httpx curl_cffi pydantic pydantic-settings beautifulsoup4

      - name: Run ECI Scraper (Automated Regional Vidhan Sabha Rotation)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REGION: ${{ inputs.region || 'AUTO_BY_DAY' }}
          TARGET_STATE: ${{ inputs.state || 'ALL' }}
          BATCH_LIMIT: ${{ inputs.batch_limit || '0' }}
          MAX_CANDIDATES_PER_AC: ${{ inputs.max_candidates || '2' }}
          CONSTITUENCY_NO: "all"
          HOUSE: "Vidhan Sabha"
          PYTHONPATH: .
        run: |
          python -m src.ingestion.eci_affidavits
