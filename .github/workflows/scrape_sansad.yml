name: Daily Sansad Attendance & Activity Sync

on:
  schedule:
    - cron: '0 4 * * 1-5' # Runs Monday to Friday at 04:00 UTC (09:30 AM IST)
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      target_term:
        description: "Lok Sabha Term ('18th' sitting parliament, '17th', or 'all')"
        required: false
        default: "all"

jobs:
  sync_sansad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install httpx pydantic pydantic-settings

      - name: Run Sansad Synchronizer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_TERM: ${{ inputs.target_term }}
          PYTHONPATH: .
        run: |
          python -m src.ingestion.sansad_api
