name: Daily Sansad Attendance & Activity Sync

on:
  schedule:
    - cron: '0 4 * * 1-5' # Runs Monday to Friday at 04:00 UTC (09:30 AM IST)
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      target_term:
        description: "Lok Sabha Term ('18th' sitting parliament, '17th', or 'all')"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  sync_sansad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install httpx pydantic pydantic-settings

      - name: Run Sansad Synchronizer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_TERM: ${{ inputs.target_term || 'all' }}
          PYTHONPATH: .
        run: |
          python -m src.ingestion.sansad_api
