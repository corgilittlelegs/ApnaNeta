name: Seed Database with Indian Parliamentarians

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      limit:
        description: "Number of MPs to ingest (0 for all ~8,300)"
        required: false
        default: "500"

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Cloud Dependencies
        run: |
          pip install httpx pydantic pydantic-settings

      - name: Run Cloud Seed Ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMIT: ${{ inputs.limit || '500' }}
          PYTHONPATH: .
        run: |
          python -m src.ingestion.seed_loaders
          python -m src.ingestion.seed_vidhan_sabha
