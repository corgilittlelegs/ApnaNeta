name: Analyze Multi-Term Historical Wealth Growth (CAGR)

on:
  schedule:
    - cron: '0 15 1 * *' # Monthly trigger on the 1st of each month at 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze_wealth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install httpx pydantic pydantic-settings

      - name: Execute Longitudinal Wealth Analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: .
        run: |
          python -m src.verification.historical_wealth
