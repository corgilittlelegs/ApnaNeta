name: Run Forensic Audit & Verification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Ingest ECI Candidate Affidavits"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install httpx pydantic pydantic-settings pytest pytest-asyncio

      - name: Run Full Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover tests -v

      - name: Execute Forensic Reconciliation & Double-Entry Math Reconciler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: .
        run: |
          python -m src.verification.math_reconciler

      - name: Audit Section 9A Commercial Conflicts of Interest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: .
        run: |
          python -m src.verification.conflict_detector

      - name: Audit Political Mobility Dynamics & Defections
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: .
        run: |
          python -m src.verification.mobility_tracker

      - name: Audit MPLADS GIS Geolocation & Ghost Projects
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: .
        run: |
          python -m src.verification.gis_verifier
