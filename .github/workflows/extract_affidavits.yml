name: Extract Form 26 Affidavits with Gemini Flash

on:
  schedule:
    - cron: '0 13 * * 0' # Runs weekly on Sundays at 13:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of candidate affidavits to extract (default: 5)"
        required: false
        default: "5"
      force:
        description: "Force re-extraction of already processed affidavits (true/false)"
        required: false
        default: "false"

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Document AI & Ingestion Dependencies
        run: |
          pip install google-genai httpx curl_cffi pydantic pydantic-settings boto3 pymupdf

      - name: Run Form 26 AI Extraction Worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          LIMIT: ${{ inputs.limit || '5' }}
          FORCE: ${{ inputs.force || 'false' }}
          PYTHONPATH: .
        run: |
          EXTRA_FLAGS=""
          if [ "$FORCE" = "true" ]; then
            EXTRA_FLAGS="--force"
          fi
          python -m src.ingestion.extract_affidavits --limit ${LIMIT} ${EXTRA_FLAGS}
